<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rent Car - Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .landing-container {
            width: 100%;
            max-width: 1440px;
            display: flex;
            flex-direction: column;
        }

        .landing-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="landing-container">
        <!-- 1. Sección Principal (Hero / Encabezado) -->
        <img src="assets/seccion1-hero.png" alt="Sección Principal - Buscar y Rentar Auto">

        <!-- 2. Cómo Funciona y Marcas -->
        <img src="assets/seccion2-como-funciona.png" alt="Pasos para rentar un auto">

        <!-- 3. Ofertas de Autos Más Populares -->
        <img src="assets/seccion3-autos-populares.png" alt="Modelos de autos disponibles">

        <!-- 4. Por Qué Elegirnos -->
        <img src="assets/seccion4-porque-elegirnos.png" alt="Beneficios y características">

        <!-- 5. Testimonios / Opiniones -->
        <img src="assets/seccion5-testimonios.png" alt="Opiniones de los clientes">

        <!-- 6. Descarga de App y Pie de Página (Footer) -->
        <img src="assets/seccion6-footer.png" alt="Descarga de App y Footer">
    </div>

</body>
</html>
